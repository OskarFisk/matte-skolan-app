name: Build MatteSkolan Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
          - os: macos-latest
            artifact: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build desktop app
        run: npm run build:desktop

      - name: Upload desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: MatteSkolan-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor Android project
        run: npm run build:android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Copy APK to release folder
        run: |
          mkdir -p release/android
          cp android/app/build/outputs/apk/debug/app-debug.apk release/android/MatteSkolan-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MatteSkolan-Android-APK
          path: release/android/MatteSkolan-debug.apk
          if-no-files-found: error
          retention-days: 30
